        .container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        .btn-back { display: inline-block; border: 1px solid #d4af37; color: #d4af37; padding: 8px 20px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; }
        .content-box { background: #131924; padding: 30px; border-radius: 12px; border: 1px solid rgba(212,175,55,0.2); line-height: 1.8; color: #a0aec0; }

    <style id="custom-grey-cards">
        .article-card, .project-card, [class*="card"], div[style*="background: #131924"], div[style*="background:#131924"], div[style*="background: #0f131d"] {
            background: #ced4da !important;
            color: #1a202c !important;
            border-color: rgba(0, 0, 0, 0.15) !important;
        }
        .article-card h3, .article-card p, .article-card span, 
        .project-card h3, .project-card p, 
        div[style*="background: #131924"] h1, div[style*="background: #131924"] h2, 
        div[style*="background: #131924"] h3, div[style*="background: #131924"] p, 
        div[style*="background: #131924"] span, div[style*="background: #131924"] div {
            color: #1a202c !important;
        }
        input, textarea, select {
            background: #ffffff !important;
            color: #1a202c !important;
            border: 1px solid #a0aec0 !important;
        }
        input::placeholder, textarea::placeholder {
            color: #718096 !important;
        }

    <style id="force-grey-theme">
        /* Force all cards, boxes and form containers to dark-grey #adb5bd */
        .article-card, .project-card, [class*="card"], .why-us div, section div[style*="background"], form, .box {
            background-color: #adb5bd !important;
            border-color: rgba(0, 0, 0, 0.2) !important;
        }
        
        /* Keep outer page body background dark for video contrast */
        body {
            background-color: #0f131d !important;
        }
        
        /* High contrast dark text for all elements inside grey cards */
        .article-card *, .project-card *, [style*="background-color: #adb5bd"] *, .why-us *, form * {
            color: #0f172a !important;
        }
        
        /* Stylish form inputs */
        input, textarea {
            background: #ffffff !important;
            color: #0f172a !important;
            border: 1px solid #6c757d !important;
        }
        input::placeholder, textarea::placeholder {
            color: #495057 !important;
        }
    </style>
    <style id="sticky-header-style">
        body {
            margin-top: 0 !important;
            padding-top: 0 !important;
        }
        header, .header-nav, nav {
            position: -webkit-sticky !important;
            position: sticky !important;
            top: 0 !important;
            z-index: 99999 !important;
            background: rgba(15, 19, 29, 0.95) !important;
            backdrop-filter: blur(10px) !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }
